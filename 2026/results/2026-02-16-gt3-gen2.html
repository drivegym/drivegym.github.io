<script>
function capText() {
  var root = document.documentElement;
  var px = parseFloat(getComputedStyle(root).fontSize);
  if (px > 20) root.style.fontSize = "20px";
}
capText();
function zoneLabel(zone) {
  if (!zone || zone === "Africa/Johannesburg") return "South Africa";
  if (zone === "Europe/Madrid") return "Spain";
  var parts = zone.split("/");
  var city = parts[parts.length - 1].replace(/_/g, " ");
  return city || "South Africa";
}
function applyLocalTimes() {
  var zone = "";
  try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { zone = ""; }
  var line = document.getElementById("zoneline");
  if (line) line.textContent = "Start time zone: " + zoneLabel(zone);
  if (!zone) return;
  document.querySelectorAll("[data-start]").forEach(function (el) {
    if (el.hasAttribute("data-countdown")) return;
    var when = new Date(el.getAttribute("data-start"));
    var clock = new Intl.DateTimeFormat("en-GB", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: zone
    }).format(when);
    if (el.hasAttribute("data-weekday")) {
      var day = new Intl.DateTimeFormat("en-GB", { weekday: "short", timeZone: zone }).format(when);
      el.textContent = day + " " + clock;
      return;
    }
    var evening = el.getAttribute("data-evening") || "";
    el.textContent = evening ? clock + " · " + evening : clock;
  });
}
function countdownLine(startIso, eveningMin, now) {
  var start = new Date(startIso);
  if (!startIso || isNaN(start.getTime())) return "Next race";
  var end = start.getTime() + (Number(eveningMin) || 0) * 60000;
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var raceDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  var days = Math.round((raceDay.getTime() - today.getTime()) / 86400000);
  if (now.getTime() >= end) return "Race done · results soon";
  if (now.getTime() >= start.getTime()) return "Racing now";
  if (days >= 2) return "Next race · in " + days + " days";
  if (days === 1) return "Next race · tomorrow";
  var ms = start.getTime() - now.getTime();
  if (ms > 3600000) return "Next race · today, in " + Math.floor(ms / 3600000) + " h";
  var mins = Math.ceil(ms / 60000);
  if (mins < 1) mins = 1;
  return "Next race · in " + mins + " min";
}
function updateCountdowns(now) {
  var clock = now || new Date();
  document.querySelectorAll("[data-countdown]").forEach(function (el) {
    el.textContent = countdownLine(el.getAttribute("data-when"), el.getAttribute("data-evening-min"), clock);
  });
}
setInterval(function () { updateCountdowns(); }, 60000);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") updateCountdowns();
});
function fitTitles() {
  document.querySelectorAll(".titleline").forEach(function (line) {
    var heading = line.querySelector("h1");
    var year = line.querySelector(".year");
    if (!heading || heading.clientWidth < 1) return;
    heading.style.fontSize = "";
    if (year) year.style.fontSize = "";
    var size = parseFloat(getComputedStyle(heading).fontSize);
    while (size > 16 && (heading.scrollWidth > heading.clientWidth || line.scrollWidth > line.clientWidth)) {
      size = Math.max(16, size - 0.5);
      heading.style.fontSize = size + "px";
      if (year) year.style.fontSize = size + "px";
      if (size === 16) break;
    }
  });
}
function fitLines() {
  document.querySelectorAll(".caption, .leadin, .series-row .meta, h2.series-name, h2.nexthead, .sub, .layout, .where, .season-row .who, .place .driver, .rname, .rsub, .rplace.rtag, .view[data-view=rhythm] .stat .who, .stat .mom, .nextrace .kicker, .nextrace .big, .nextrace .when, .startcard .kicker, .startcard .zone, .kv .v, .carline span:last-child, .ahead").forEach(function (el) {
    if (el.clientWidth < 1) return;
    el.style.fontSize = "";
    var size = parseFloat(getComputedStyle(el).fontSize);
    while (size > 16 && el.scrollWidth > el.clientWidth) {
      size = Math.max(16, size - 0.5);
      el.style.fontSize = size + "px";
      if (size === 16) break;
    }
  });
}
function fitFilters() {
  document.querySelectorAll(".filters button").forEach(function (el) {
    el.style.fontSize = "";
    var size = parseFloat(getComputedStyle(el).fontSize);
    while (size > 16 && el.scrollWidth > el.clientWidth) {
      size = Math.max(16, size - 0.5);
      el.style.fontSize = size + "px";
      if (size === 16) break;
    }
  });
}
function fitMetal() {
  document.querySelectorAll(".metaline").forEach(function (line) {
    var crown = line.querySelector(".crownline");
    if (!crown || line.clientWidth < 1) return;
    crown.style.fontSize = "";
    var size = parseFloat(getComputedStyle(crown).fontSize);
    while (size > 16 && line.scrollWidth > line.clientWidth) {
      size = Math.max(16, size - 0.5);
      crown.style.fontSize = size + "px";
      if (size === 16) break;
    }
  });
}
function pageStem() {
  var counted = document.body && document.body.getAttribute("data-count-as");
  if (counted) {
    if (counted.length > 5 && counted.slice(-5).toLowerCase() === ".html")
      counted = counted.slice(0, -5);
    return counted || "/";
  }
  var path = location.pathname || "/";
  if (path.length > 5 && path.slice(-5).toLowerCase() === ".html") path = path.slice(0, -5);
  if (path.length > 1 && path.charAt(path.length - 1) === "/") path = path.slice(0, -1);
  return path || "/";
}
function cupSlug(cup) {
  var out = "";
  var i;
  for (i = 0; i < cup.length; i++) {
    var code = cup.charCodeAt(i);
    var alnum = (code >= 48 && code <= 57) || (code >= 65 && code <= 90) || (code >= 97 && code <= 122);
    out += alnum ? cup.charAt(i).toLowerCase() : "-";
  }
  return out.replace(/^-+|-+$/g, "");
}
function countTab(path) {
  try {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: path, title: document.title, event: false });
    }
  } catch (e) { /* never let counting affect the page */ }
}
function showView(name) {
  document.querySelectorAll(".viewtabs button").forEach(function (btn) {
    var on = btn.getAttribute("data-view") === name;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll(".view").forEach(function (panel) {
    panel.classList.toggle("hidden", panel.getAttribute("data-view") !== name);
  });
  fitTitles();
  fitLines();
  fitMetal();
}
document.addEventListener("DOMContentLoaded", function () {
  applyLocalTimes();
  updateCountdowns();
  fitTitles();
  fitFilters();
  fitLines();
  fitMetal();
  document.querySelectorAll(".viewtabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var name = btn.getAttribute("data-view");
      var already = btn.classList.contains("on");
      showView(name);
      if (!already && name) countTab(pageStem() + "/" + name);
    });
  });
  var asked = location.hash.replace("#", "");
  if (asked === "pace" || asked === "rhythm") showView(asked);
  armRaceSwipe();
});
function armRaceSwipe() {
  if (!document.body || document.body.getAttribute("data-page") !== "race") return;
  var older = document.body.getAttribute("data-older") || "";
  var newer = document.body.getAttribute("data-newer") || "";
  if (!older && !newer) return;
  var olderTabs = document.body.getAttribute("data-older-tabs") === "1";
  var newerTabs = document.body.getAttribute("data-newer-tabs") === "1";
  var sheet = document.querySelector(".pane");
  if (!sheet) return;
  var startX = 0;
  var startY = 0;
  var startT = 0;
  var watching = false;
  var dragging = false;
  var scrolling = false;
  var gone = false;
  function resetSwipe() {
    gone = false;
    dragging = false;
    watching = false;
    scrolling = false;
    sheet.style.transform = "";
    sheet.classList.remove("follow");
    sheet.classList.remove("return");
    sheet.classList.remove("leave");
  }
  window.addEventListener("pageshow", function () {
    resetSwipe();
  });
  function openRace(href, hasTabs, dir) {
    if (!href || gone) return;
    gone = true;
    var on = document.querySelector(".viewtabs button.on");
    var name = on ? (on.getAttribute("data-view") || "") : "";
    var hash = (hasTabs && (name === "pace" || name === "rhythm")) ? ("#" + name) : "";
    window.location.href = href + hash;
  }
  function shift(dx) {
    var width = window.innerWidth || 1;
    var href = dx < 0 ? newer : older;
    var x = dx;
    if (!href) {
      var cap = Math.min(48, width * 0.12);
      x = dx < 0 ? Math.max(dx * 0.2, -cap) : Math.min(dx * 0.2, cap);
    }
    sheet.style.transform = "translateX(" + x + "px)";
  }
  function springBack() {
    dragging = false;
    sheet.classList.remove("follow");
    sheet.classList.add("return");
    void sheet.offsetWidth;
    sheet.style.transform = "translateX(0px)";
    var clear = function () {
      sheet.style.transform = "";
      sheet.classList.remove("return");
      sheet.removeEventListener("transitionend", clear);
    };
    sheet.addEventListener("transitionend", clear);
  }
  function slideOff(dir) {
    var href = dir === "newer" ? newer : older;
    var hasTabs = dir === "newer" ? newerTabs : olderTabs;
    if (!href) {
      springBack();
      return;
    }
    var width = window.innerWidth || 1;
    sheet.classList.remove("follow");
    sheet.classList.add("leave");
    void sheet.offsetWidth;
    sheet.style.transform = "translateX(" + (dir === "newer" ? -width : width) + "px)";
    var left = false;
    var go = function () {
      if (left) return;
      left = true;
      openRace(href, hasTabs, dir);
    };
    var timer = setTimeout(go, 280);
    sheet.addEventListener("transitionend", function () {
      clearTimeout(timer);
      go();
    });
  }
  document.addEventListener("touchstart", function (event) {
    if (gone) return;
    if (event.touches.length !== 1) {
      watching = false;
      if (dragging) springBack();
      dragging = false;
      return;
    }
    var touch = event.touches[0];
    var x = touch.clientX;
    if (x < 30 || x > window.innerWidth - 30) {
      watching = false;
      return;
    }
    watching = true;
    dragging = false;
    scrolling = false;
    startX = x;
    startY = touch.clientY;
    startT = event.timeStamp;
  }, { passive: true });
  document.addEventListener("touchmove", function (event) {
    if (!watching || gone) return;
    if (event.touches.length !== 1) {
      watching = false;
      if (dragging) springBack();
      dragging = false;
      return;
    }
    var touch = event.touches[0];
    var dx = touch.clientX - startX;
    var dy = touch.clientY - startY;
    if (scrolling) return;
    if (!dragging) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
        scrolling = true;
        return;
      }
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2) return;
      dragging = true;
      sheet.classList.add("follow");
      sheet.classList.remove("return");
      sheet.classList.remove("leave");
    }
    if (event.cancelable) event.preventDefault();
    shift(dx);
  }, { passive: false });
  document.addEventListener("touchend", function (event) {
    if (!watching || gone) return;
    watching = false;
    var touch = event.changedTouches && event.changedTouches[0];
    if (!touch) {
      if (dragging) springBack();
      dragging = false;
      return;
    }
    var dx = touch.clientX - startX;
    var dy = touch.clientY - startY;
    var dt = Math.max(event.timeStamp - startT, 1);
    var sideways = Math.abs(dx) >= Math.abs(dy) * 2;
    var flick = sideways && Math.abs(dx) >= 40 && (Math.abs(dx) / dt) >= 0.4;
    var far = Math.abs(dx) >= window.innerWidth * 0.35;
    var commit = sideways && (far || flick);
    dragging = false;
    if (!commit) {
      if (sheet.style.transform) springBack();
      return;
    }
    slideOff(dx < 0 ? "newer" : "older");
  }, { passive: true });
  document.addEventListener("touchcancel", function () {
    watching = false;
    if (dragging) springBack();
    dragging = false;
  }, { passive: true });
  document.addEventListener("keydown", function (event) {
    if (gone || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    var tag = event.target && event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (event.target && event.target.isContentEditable)) return;
    if (event.key === "ArrowRight") {
      if (!newer) return;
      event.preventDefault();
      openRace(newer, newerTabs, "newer");
    } else if (event.key === "ArrowLeft") {
      if (!older) return;
      event.preventDefault();
      openRace(older, olderTabs, "older");
    }
  });
}
window.addEventListener("pageshow", function () {
  capText();
  document.querySelectorAll(".pane").forEach(function (sheet) {
    sheet.style.transform = "";
    sheet.classList.remove("follow");
    sheet.classList.remove("return");
    sheet.classList.remove("leave");
  });
  updateCountdowns();
  fitTitles();
  fitFilters();
  fitLines();
  fitMetal();
});
window.addEventListener("resize", function () {
  fitTitles();
  fitFilters();
  fitLines();
  fitMetal();
});
</script>
