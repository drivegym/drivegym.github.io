<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17191C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DriveGym">
<title>Seasons</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=27">
<script>
function capText() {
  var root = document.documentElement;
  var px = parseFloat(getComputedStyle(root).fontSize);
  if (px > 20) root.style.fontSize = "20px";
}
capText();
function zoneLabel(zone) {
  if (!zone || zone === "Africa/Johannesburg") return "South Africa";
  if (zone === "Europe/Madrid") return "Spain";
  var parts = zone.split("/");
  var city = parts[parts.length - 1].replace(/_/g, " ");
  return city || "South Africa";
}
function applyLocalTimes() {
  var zone = "";
  try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { zone = ""; }
  var line = document.getElementById("zoneline");
  if (line) line.textContent = "Start time zone: " + zoneLabel(zone);
  if (!zone) return;
  document.querySelectorAll("[data-start]").forEach(function (el) {
    var when = new Date(el.getAttribute("data-start"));
    var clock = new Intl.DateTimeFormat("en-GB", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: zone
    }).format(when);
    var evening = el.getAttribute("data-evening") || "";
    el.textContent = evening ? clock + " · " + evening : clock;
  });
}
function fitTitles() {
  document.querySelectorAll(".titleline").forEach(function (line) {
    var heading = line.querySelector("h1");
    var year = line.querySelector(".year");
    if (!heading || heading.clientWidth < 1) return;
    heading.style.fontSize = "";
    if (year) year.style.fontSize = "";
    var size = parseFloat(getComputedStyle(heading).fontSize);
    while (size > 16 && (heading.scrollWidth > heading.clientWidth || line.scrollWidth > line.clientWidth)) {
      size = Math.max(16, size - 0.5);
      heading.style.fontSize = size + "px";
      if (year) year.style.fontSize = size + "px";
      if (size === 16) break;
    }
  });
}
function fitLines() {
  document.querySelectorAll(".caption, .leadin, .series-row .meta, h2.series-name, .sub, .where, .season-row .who, .place .driver, .rname, .rsub, .rplace.rtag, .view[data-view=rhythm] .stat .who, .stat .mom").forEach(function (el) {
    if (el.clientWidth < 1) return;
    el.style.fontSize = "";
    var size = parseFloat(getComputedStyle(el).fontSize);
    while (size > 16 && el.scrollWidth > el.clientWidth) {
      size = Math.max(16, size - 0.5);
      el.style.fontSize = size + "px";
      if (size === 16) break;
    }
  });
}
function fitFilters() {
  document.querySelectorAll(".filters button").forEach(function (el) {
    el.style.fontSize = "";
    var size = parseFloat(getComputedStyle(el).fontSize);
    while (size > 16 && el.scrollWidth > el.clientWidth) {
      size = Math.max(16, size - 0.5);
      el.style.fontSize = size + "px";
      if (size === 16) break;
    }
  });
}
function fitMetal() {
  document.querySelectorAll(".metaline").forEach(function (line) {
    var crown = line.querySelector(".crownline");
    if (!crown || line.clientWidth < 1) return;
    crown.style.fontSize = "";
    var size = parseFloat(getComputedStyle(crown).fontSize);
    while (size > 16 && line.scrollWidth > line.clientWidth) {
      size = Math.max(16, size - 0.5);
      crown.style.fontSize = size + "px";
      if (size === 16) break;
    }
  });
}
function pageStem() {
  var counted = document.body && document.body.getAttribute("data-count-as");
  if (counted) {
    if (counted.length > 5 && counted.slice(-5).toLowerCase() === ".html")
      counted = counted.slice(0, -5);
    return counted || "/";
  }
  var path = location.pathname || "/";
  if (path.length > 5 && path.slice(-5).toLowerCase() === ".html") path = path.slice(0, -5);
  if (path.length > 1 && path.charAt(path.length - 1) === "/") path = path.slice(0, -1);
  return path || "/";
}
function cupSlug(cup) {
  var out = "";
  var i;
  for (i = 0; i < cup.length; i++) {
    var code = cup.charCodeAt(i);
    var alnum = (code >= 48 && code <= 57) || (code >= 65 && code <= 90) || (code >= 97 && code <= 122);
    out += alnum ? cup.charAt(i).toLowerCase() : "-";
  }
  return out.replace(/^-+|-+$/g, "");
}
function countTab(path) {
  try {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: path, title: document.title, event: false });
    }
  } catch (e) { /* never let counting affect the page */ }
}
function showView(name) {
  document.querySelectorAll(".viewtabs button").forEach(function (btn) {
    var on = btn.getAttribute("data-view") === name;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll(".view").forEach(function (panel) {
    panel.classList.toggle("hidden", panel.getAttribute("data-view") !== name);
  });
  fitTitles();
  fitLines();
  fitMetal();
}
document.addEventListener("DOMContentLoaded", function () {
  applyLocalTimes();
  fitTitles();
  fitFilters();
  fitLines();
  fitMetal();
  document.querySelectorAll(".viewtabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var name = btn.getAttribute("data-view");
      var already = btn.classList.contains("on");
      showView(name);
      if (!already && name) countTab(pageStem() + "/" + name);
    });
  });
  var asked = location.hash.replace("#", "");
  if (asked === "pace" || asked === "rhythm") showView(asked);
});
window.addEventListener("pageshow", function () {
  capText();
  fitTitles();
  fitFilters();
  fitLines();
  fitMetal();
});
window.addEventListener("resize", function () {
  fitTitles();
  fitFilters();
  fitLines();
  fitMetal();
});
</script>
</head>
<body data-page="seasons">
<div class="page">
<section class="head"><div class="titleline"><img src="icon.png" alt=""><h1>Seasons</h1></div><span class="caption">Choose a season</span></section><section class="list"><div class="season-row soon"><span class="yr">2027</span><span class="stack"><span class="who">Coming soon</span><span class="detail">Calendar not out yet</span></span></div><a class="season-row" data-year="2026" href="2026/standings.html"><span class="yr">2026</span><span class="stack"><span class="who">Current season</span><span class="detail">31 of 37 races · Len leads</span></span><span class="chev" aria-hidden="true">›</span></a></section>
<script>
var from = "standings";
try {
  var asked = new URLSearchParams(location.search).get("from");
  if (asked === "race" || asked === "calendar" || asked === "standings") from = asked;
} catch (err) {}
document.querySelectorAll("nav.tabs a").forEach(function (link) {
  link.classList.toggle("on", link.getAttribute("data-tab") === from);
});
var page = from === "race" ? "index.html" : from === "calendar" ? "calendar.html" : "standings.html";
document.querySelectorAll("[data-year]").forEach(function (link) {
  link.setAttribute("href", link.getAttribute("data-year") + "/" + page);
});
</script>

<nav class="tabs"><a class="" data-tab="race" href="index.html">Results</a><a class="" data-tab="standings" href="standings.html">Standings</a><a class="" data-tab="calendar" href="calendar.html">Calendar</a></nav>
</div>


<script>
(function () {
  try {
    var hash = location.hash || "";
    var stem = pageStem();
    var path = "";
    var kind = document.body.getAttribute("data-page");
    var countAs = document.body.getAttribute("data-count-as");
    if (countAs) path = countAs;
    if (kind === "race") {
      var asked = hash.replace("#", "");
      if ((asked === "pace" || asked === "rhythm") && document.querySelector(".view[data-view='" + asked + "']"))
        path = stem + "/" + asked;
    } else if (kind === "standings") {
      if (hash === "#series") path = stem + "/series";
      else if (hash === "#best") path = stem + "/best-drive";
      else if (hash.indexOf("#series-") === 0)
        path = stem + "/series/" + cupSlug(decodeURIComponent(hash.slice(8)));
    }
    if (path) {
      window.goatcounter = window.goatcounter || {};
      window.goatcounter.path = path;
    }
  } catch (e) {}
})();
</script>
<script data-goatcounter="https://drivegym.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>
